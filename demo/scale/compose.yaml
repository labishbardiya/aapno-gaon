x-app: &app
  image: aapno-gaon:scale-demo
  build: ../..
  depends_on:
    primary:
      condition: service_healthy
    replica:
      condition: service_healthy
    redis:
      condition: service_healthy
    auth:
      condition: service_started
x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:local-demo-only@primary/postgres
  DEMO_REPLICA_URL: postgresql://postgres:local-demo-only@replica/postgres
  DEMO_REDIS_URL: redis://redis:6379
  RECEIPT_SECRET: local-compose-demo-receipt-secret-across-instances
  SUPABASE_URL: http://auth:9999
  SUPABASE_PUBLISHABLE_KEY: local-demo
services:
  primary:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: local-demo-only
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cp /primary-init.sh /docker-entrypoint-initdb.d/01-demo.sh
        chmod 644 /docker-entrypoint-initdb.d/01-demo.sh
        exec docker-entrypoint.sh "$$@"
      - --
    command: [postgres, -c, wal_level=replica, -c, max_wal_senders=4, -c, wal_keep_size=64MB]
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ../../supabase/migrations:/schema:ro
      - .:/fixtures:ro
      - ./primary-init.sh:/primary-init.sh:ro
    healthcheck:
      test: [CMD, pg_isready, -h, '127.0.0.1', -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 30
  replica:
    image: postgres:17-alpine
    depends_on:
      primary:
        condition: service_healthy
    entrypoint: [/bin/sh, /replica-start.sh]
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./replica-start.sh:/replica-start.sh:ro
    healthcheck:
      test: [CMD-SHELL, "psql -U postgres -Atc 'select pg_is_in_recovery()' | grep -qx t"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20
  auth:
    image: node:24-alpine
    environment:
      DEMO_PASSWORD: DhindaDemo2026
    volumes:
      - ./auth.cjs:/demo/auth.cjs:ro
    command: [node, /demo/auth.cjs]
  app-1:
    <<: *app
    environment: { <<: *app-env, DEMO_INSTANCE: app-1 }
  app-2:
    <<: *app
    environment: { <<: *app-env, DEMO_INSTANCE: app-2 }
  app-3:
    <<: *app
    environment: { <<: *app-env, DEMO_INSTANCE: app-3 }
  app-4:
    <<: *app
    environment: { <<: *app-env, DEMO_INSTANCE: app-4 }
  nginx:
    image: nginx:alpine
    depends_on: [app-1, app-2, app-3, app-4]
    ports:
      - '127.0.0.1:3195:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  primary-data:
  replica-data:
