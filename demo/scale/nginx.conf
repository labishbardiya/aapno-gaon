events {}
http {
  upstream round_robin {
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
    server app-4:3000;
  }
  upstream least_connections {
    least_conn;
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
    server app-4:3000;
  }
  upstream client_ip {
    ip_hash;
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
    server app-4:3000;
  }
  upstream random_two {
    random two least_conn;
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
    server app-4:3000;
  }
  map $server_port $backend {
    80 round_robin;
    81 least_connections;
    82 client_ip;
    83 random_two;
  }
  server {
    listen 80;
    listen 81;
    listen 82;
    listen 83;
    location / {
      proxy_pass http://$backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout;
      add_header X-Demo-Upstream $upstream_addr always;
    }
  }
}
