events {}
http {
  upstream aapno {
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
    server app-4:3000;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://aapno;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout;
      add_header X-Demo-Upstream $upstream_addr always;
    }
  }
}
